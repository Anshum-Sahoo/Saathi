<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f3" />
    <meta name="description" content="A calmer way to keep track of medicines, appointments, and the people who help." />
    <title>Carewell — A little more peace of mind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#today" aria-label="Carewell home"><span class="brand-mark">✳</span><span>carewell</span></a>
        <div class="profile-mini"><div class="avatar avatar-lilac">EM</div><div><strong>Elaine Morgan</strong><span>Personal care plan</span></div><span class="chevron">⌄</span></div>
        <p class="nav-label">YOUR SPACE</p>
        <nav class="main-nav">
          <button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span>Today</button>
          <button class="nav-item" data-view="medications"><span class="nav-icon">◉</span>My medicines</button>
          <button class="nav-item" data-view="appointments"><span class="nav-icon">▦</span>Appointments</button>
          <button class="nav-item" data-view="family"><span class="nav-icon">♡</span>My people</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-icon">✦</span><strong>Need a hand?</strong><p>Someone you trust can help keep things on track.</p><button class="text-link" data-view="family">Manage my people <span>→</span></button></div>
          <button class="nav-item settings-item" id="reminders-button"><span class="nav-icon">⚙</span>Reminder settings</button>
          <div class="sidebar-foot"><span class="online-dot"></span> Your information stays on this device</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar"><div class="breadcrumb">My care <span>/</span> <strong id="page-crumb">Today</strong></div><div class="top-actions"><button class="icon-button" id="help-button" aria-label="Help">?</button><button class="top-profile"><span class="avatar avatar-lilac">EM</span><span>Elaine</span><span class="chevron">⌄</span></button></div></header>
        <section id="view-root" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="form-dialog" class="dialog"><form id="item-form" method="dialog"><div class="dialog-head"><div><p class="eyebrow" id="dialog-eyebrow">YOUR CARE PLAN</p><h2 id="dialog-title">Add a medicine</h2></div><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div><div id="form-fields" class="form-fields"></div><p class="form-error" id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button button-quiet close-dialog">Cancel</button><button type="submit" class="button button-primary" id="submit-label">Save medicine</button></div></form></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
